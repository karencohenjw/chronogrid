name: Publish ChronoGrid to Docker Hub

on:
  workflow_dispatch:
  push:
    tags:
      - v0.1.0

permissions:
  contents: read

jobs:
  publish:
    name: Build, publish, and verify public image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jwcalendar/chronogrid
          tags: |
            type=raw,value=latest
            type=raw,value=0.1.0
            type=raw,value=0.1

      - name: Build and publish multi-platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Log out before anonymous public-image checks
        run: docker logout

      - name: Pull and run the public image
        shell: bash
        run: |
          docker pull jwcalendar/chronogrid:latest
          docker run --rm jwcalendar/chronogrid:latest challenge
          output="$(docker run --rm jwcalendar/chronogrid:latest date inspect 2027-01-01 --timezone America/New_York)"
          printf '%s\n' "$output"
          for expected in \
            'date: 2027-01-01' \
            'weekday: Friday' \
            'ordinal day: 001' \
            'ISO week date: 2026-W53-5' \
            'leap year: false' \
            'days in month: 31'; do
            printf '%s\n' "$output" | grep -Fq "$expected" || { echo "Missing expected line: $expected" >&2; exit 1; }
          done
