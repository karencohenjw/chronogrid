name: Publish ChronoGrid 0.2.0 to Chocolatey Community

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: chocolatey-chronogrid-0.2.0
  cancel-in-progress: false

jobs:
  publish:
    name: Inspect and publish the tested 0.2.0 package
    runs-on: windows-latest
    steps:
      - name: Download the tested package artifact
        uses: actions/download-artifact@v4
        with:
          name: chronogrid-chocolatey-nupkg
          path: ${{ runner.temp }}/chronogrid-nupkg
          repository: karencohenjw/chronogrid
          run-id: 37024182831
          github-token: ${{ github.token }}

      - name: Inspect package and release checksums
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'chronogrid-nupkg'
          $packages = @(Get-ChildItem -LiteralPath $packageDir -Filter '*.nupkg' -File -Recurse)
          if ($packages.Count -ne 1) { throw "Expected exactly one nupkg in the tested artifact; found $($packages.Count)." }
          $package = $packages[0]
          if ($package.Name -cne 'chronogrid.0.2.0.nupkg') { throw "Unexpected package filename: $($package.Name)" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object FullName)
            $nuspecEntries = @($archive.Entries | Where-Object { $_.FullName -match '\.nuspec$' })
            if ($nuspecEntries.Count -ne 1) { throw "Expected exactly one nuspec; found $($nuspecEntries.Count)." }
            if ($entries -notcontains 'tools/chocolateyInstall.ps1') { throw 'Chocolatey install script is missing.' }
            if ($entries | Where-Object { $_ -match '(?i)\.(exe|dll|zip|bat|cmd|psm1)$' }) { throw 'Unexpected executable or unrelated payload found in package.' }
            foreach ($entryName in $entries) {
              if ($entryName -notin @('[Content_Types].xml', '_rels/.rels', 'chronogrid.nuspec', $nuspecEntries[0].FullName) -and
                  $entryName -notmatch '^package/services/metadata/core-properties/[^/]+\.psmdcp$' -and
                  $entryName -cne 'tools/chocolateyInstall.ps1') {
                throw "Unexpected package entry: $entryName"
              }
            }

            $nuspecStream = $nuspecEntries[0].Open()
            $reader = [System.IO.StreamReader]::new($nuspecStream)
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose(); $nuspecStream.Dispose() }
            $metadata = $nuspec.SelectSingleNode("//*[local-name()='metadata']")
            if (-not $metadata) { throw 'Package metadata is missing.' }
            $readMetadata = { param($name) $node = $metadata.SelectSingleNode("*[local-name()='$name']"); if ($node) { $node.InnerText } else { '' } }
            $expected = @{
              id = 'chronogrid'
              version = '0.2.0'
              authors = 'Karen Cohen'
              projectUrl = 'https://jwcalendar.com/'
              projectSourceUrl = 'https://github.com/karencohenjw/chronogrid'
              packageSourceUrl = 'https://github.com/karencohenjw/chronogrid/tree/main/packaging/chocolatey/chronogrid'
              docsUrl = 'https://github.com/karencohenjw/chronogrid/tree/v0.2.0/docs'
              bugTrackerUrl = 'https://github.com/karencohenjw/chronogrid/issues'
              licenseUrl = 'https://raw.githubusercontent.com/karencohenjw/chronogrid/v0.2.0/LICENSE'
              releaseNotes = 'https://github.com/karencohenjw/chronogrid/releases/tag/v0.2.0'
            }
            foreach ($name in $expected.Keys) {
              $actual = & $readMetadata $name
              if ($actual -cne $expected[$name]) { throw "Unexpected package metadata for $name." }
            }

            $scriptEntry = $archive.GetEntry('tools/chocolateyInstall.ps1')
            $scriptStream = $scriptEntry.Open()
            $scriptReader = [System.IO.StreamReader]::new($scriptStream)
            try { $installScript = $scriptReader.ReadToEnd() } finally { $scriptReader.Dispose(); $scriptStream.Dispose() }
            $credentialPattern = '(?i)(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(?:password|token|api[_-]?key)\s*[:=]\s*\S+|C:\\Users\\|/Users/[^/]+/)'
            foreach ($text in @($installScript, $nuspec.OuterXml)) {
              if ($text -match $credentialPattern) { throw 'Package contains a credential pattern or local user path.' }
            }
            if ($installScript -match '__SHA256_|__CHECKSUM__') { throw 'Package contains an unfinished checksum.' }

            $manifest = (Invoke-WebRequest -Uri 'https://github.com/karencohenjw/chronogrid/releases/download/v0.2.0/SHA256SUMS.txt' -UseBasicParsing).Content
            foreach ($arch in @('i686', 'x86_64')) {
              $expectedLine = [regex]::Escape("chronogrid-0.2.0-windows-$arch.zip")
              $manifestMatch = [regex]::Match($manifest, "(?im)^([0-9a-f]{64})\s+$expectedLine$")
              if (-not $manifestMatch.Success) { throw "SHA256SUMS.txt lacks the $arch archive checksum." }
              $releaseHash = $manifestMatch.Groups[1].Value
              $checksumVar = if ($arch -eq 'i686') { 'checksum32' } else { 'checksum64' }
              $checksumMatch = [regex]::Match($installScript, "(?im)^\$$checksumVar\s*=\s*'([0-9a-f]{64})'")
              if (-not $checksumMatch.Success -or $checksumMatch.Groups[1].Value -cne $releaseHash) { throw "Chocolatey $arch checksum does not match the published release manifest." }
            }
          } finally { $archive.Dispose() }

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            Set-ExecutionPolicy Bypass -Scope Process -Force
            $officialInstaller = (Invoke-WebRequest -Uri 'https://community.chocolatey.org/install.ps1' -UseBasicParsing).Content
            Invoke-Expression $officialInstaller
          }
          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) { throw 'Chocolatey CLI is unavailable after the official installation check.' }
          choco --version
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey CLI version check failed.' }

          $existingUri = "https://community.chocolatey.org/api/v2/Packages(Id='chronogrid',Version='0.2.0')"
          $existingResponse = Invoke-WebRequest -Uri $existingUri -UseBasicParsing -SkipHttpErrorCheck
          if ($existingResponse.StatusCode -ge 200 -and $existingResponse.StatusCode -lt 300) { throw 'ChronoGrid 0.2.0 is already present in the Community feed; refusing to push a duplicate.' }
          if ($existingResponse.StatusCode -ne 404) { throw "Could not safely check whether ChronoGrid 0.2.0 already exists (HTTP $($existingResponse.StatusCode))." }

      - name: Push ChronoGrid 0.2.0 to Chocolatey Community
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHOCO_API_KEY)) { throw 'CHOCOLATEY_API_KEY secret is not configured.' }
          $packageDir = Join-Path $env:RUNNER_TEMP 'chronogrid-nupkg'
          $package = Get-Item -LiteralPath (Join-Path $packageDir 'chronogrid.0.2.0.nupkg')
          choco push $package.FullName --source https://push.chocolatey.org/ --api-key "$env:CHOCO_API_KEY" --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey push failed with exit code $LASTEXITCODE." }
